<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Busca de Moradores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>  
        <div class="buscar-morador">
            <h2>Busca de Moradores do Condomínio</h2>
            <form action="buscarMorador.php" method="POST">
                <select name="tipo_busca" required>
                    <option value="">Selecione o tipo de busca</option>
                    <option value="bloco">Bloco</option>
                    <option value="ap">Apartamento</option>
                    <option value="morador">Nome do Morador</option>
                </select>
                <input type="text" name="valor_busca" placeholder="Digite o valor para busca" required>
                <button type="submit">Buscar</button>
                <button type="reset">Limpar</button>
            </form>
        </div>
    </nav>

</body>
</html>
