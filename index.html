<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Busca de Moradores</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <nav>  
        <div class="buscar-morador">
            <h2>Busca de Moradores do Condomínio</h2>            
            <form action="buscarMorador.php" method="POST">
                <select name="tipo_busca" required>
                    <option value="">Selecione o tipo de busca</option>
                    <option value="bloco">Bloco</option>
                    <option value="apartamento">Apartamento</option>
                    <option value="morador">Nome do Morador</option>
                </select>
                <input type="text" name="valor_busca" placeholder="Digite o valor para busca" required>
                <div class="button-container">                    
                    <button type="submit" class="btn btn-success">Buscar</button>
                    <button type="reset" class="btn btn-danger">Limpar</button>
                    <a href="cadastroMorador.php" class="btn btn-primary">Cadastrar</a>
                </div>               
            </form>
        </div>
    </nav>
