<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Moradores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="menu-links">
            <a href="index.html">Buscar Morador</a>
            
        </div>
    </nav>
    
    <div class="cadastrar-morador">
        <h2>Cadastro de Morador</h2>
        
       
        
        <form action="cadastroMorador.html" method="POST">
            <div class="form-group">
                <label for="nome">Nome do Morador:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
            </div>
            
            <div class="form-group">
                <label for="bloco">Bloco:</label>
                <input type="text" id="bloco" name="bloco" placeholder="Digite o bloco" required>
            </div>
            
            <div class="form-group">
                <label for="ap">Número do Apartamento:</label>
                <input type="text" id="ap" name="ap" placeholder="Digite o número do apartamento" required>
            </div>
            
            <div class="form-actions">
                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </div>
        </form>
    </div>
</body>
</html>
